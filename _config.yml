# ============================================================
#  Site
# ============================================================
title: Andrii Iakovliev
description: >-
  Andrii Iakovliev — post-doctoral researcher in genetic epidemiology and
  precision medicine at the University of Edinburgh.
url: https://whimsial.github.io
baseurl: ""
lang: en

# ============================================================
#  Author / profile
#  Edit these to change the homepage header and contact links.
# ============================================================
author:
  name: Andrii Iakovliev
  role: MRC Cross-Disciplinary Fellow (XDF)
  affiliation: >-
    <a href="https://institute-genetics-cancer.ed.ac.uk/">Institute of Genetics and Cancer</a>,
    University of Edinburgh
  photo: /assets/img/avatar.jpg
  email: andrii.iakovliev@ed.ac.uk
  orcid: 0000-0003-4031-0073
  scholar: bHkG2loAAAAJ
  researchgate: Andrii_Iakovliev
  github: whimsial
  linkedin: andrii-iakovliev-81ab0080

# ============================================================
#  Build
# ============================================================
collections:
  pages:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Blog posts (kept available, not linked in the nav) live under /blog/.
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE.txt
  - scripts
  - vendor
  - me.pdf
  - env.pdf
  - narrative.md
