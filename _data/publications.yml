- title: 'Genome-wide aggregated trans-effects on risk of type 1 diabetes: A test of the “omnigenic” sparse
    effector hypothesis of complex trait genetics'
  authors:
  - Andrii Iakovliev
  - Stuart J. McGurnaghan
  - Caroline Hayward
  - Marco Colombo
  - Debby Lipschutz
  - Athina Spiliopoulou
  - Helen M. Colhoun
  - Paul M. McKeigue
  year: 2023
  venue: The American Journal of Human Genetics
  type: article
  doi: 10.1016/j.ajhg.2023.04.003
  url: http://dx.doi.org/10.1016/j.ajhg.2023.04.003
  pdf_url: http://www.cell.com/article/S0002929723001271/pdf
  abstract: Summary The “omnigenic” hypothesis postulates that the polygenic effects of common SNPs on
    a typical complex trait are mediated through trans-effects on expression of a relatively sparse set
    of effector (“core”) genes. We tested this hypothesis in a study of 4,964 cases of type 1 diabetes
    (T1D) and 7,497 controls by using summary statistics to calculate aggregated (excluding the HLA region)
    trans-scores for gene expression in blood. From associations of T1D with aggregated trans-scores,
    nine putative core genes were identified, of which three—STAT1, CTLA4 and FOXP3—are genes in which
    variants cause monogenic forms of autoimmune diabetes. Seven of these genes affect the activity of
    regulatory T cells, and two are involved in immune responses to microbial lipids. Four T1D-associated
    genomic regions could be identified as master regulators via trans-effects on gene expression. These
    results support the sparse effector hypothesis and reshape our understanding of the genetic architecture
    of T1D.
  source: orcid
- title: 'Inference of causal and pleiotropic effects with multiple weak genetic instruments: application
    to effect of adiponectin on type 2 diabetes'
  authors:
  - Paul M McKeigue
  - Andrii Iakovliev
  - Athina Spiliopoulou
  - Buddhiprabha Erabadda
  - Helen M Colhoun
  year: 2023
  venue: null
  type: preprint
  doi: 10.1101/2023.12.15.23300008
  url: https://doi.org/10.1101/2023.12.15.23300008
  pdf_url: https://www.medrxiv.org/content/medrxiv/early/2023/12/17/2023.12.15.23300008.full.pdf
  abstract: 'Current methods for Mendelian randomization studies have several limitations: to construct
    unlinked genetic instruments they can use only one SNP from each clump of exposure-associated SNPs,
    they require that weak instruments are excluded, and they rely on makeshift procedures for downweighting
    outliers to allow inference of causality in the presence of pleiotropic effects. This paper describes
    methods that overcome these limitations. A scalar instrument is constructed from all exposure-associated
    SNPs in each clump, and inference of causality is based on marginalizing over the distribution of
    pleiotropic effects. To demonstrate the approach, we tested the effect of circulating levels of adiponectin,
    encoded by ADIPOQ, on the risk of type 2 diabetes. Genotypic instruments were constructed from 24
    unlinked trans-pQTLs detected in Icelanders using the Somalogic platform and 43 detected in the UK
    Biobank study using the Olink platform. These instruments were tested for association with type 2
    diabetes in a non-overlapping subset of the UK Biobank cohort. In contrast to the results of earlier
    Mendelian randomization studies of adiponectin that used only a cis-pQTL, with multiple trans-pQTLs
    there was clear evidence for a causal effect: standardized log odds ratio -0.38 (95% CI -0.5 to -0.25)
    using DeCODE instruments and -0.33 (95% CI -0.43 to -0.23) using UK Biobank instruments. Guidelines
    for the design of Mendelian randomization studies that recommend exclusion of weak instruments, or
    restricting the instruments to cis-acting variants where the exposure under study is a gene transcript
    or gene product, should be reassessed.'
  source: orcid
