- title: Exact elastic stability analysis based on dynamic stiffness method
  authors:
  - Andrii Iakovliev
  year: 2016
  venue: Journal of Mechanical Engineering NTUU Kyiv Polytechnic Institute
  type: article
  doi: 10.20535/2305-9001.2016.77.78904
