name: Update publications

# Refreshes _data/publications.yml from ORCID + _bibliography/extra.bib.
# Opens a pull request with the updated file so it can be merged into master.

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch publications
        env:
          # Optional: add an S2_API_KEY repository secret for higher rate limits.
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python scripts/fetch_publications.py

      - name: Open pull request with updated publications
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update publications from ORCID"
          branch: update-publications
          title: "Update publications from ORCID"
          body: "Automated update of `_data/publications.yml` fetched from ORCID."
          add-paths: _data/publications.yml
