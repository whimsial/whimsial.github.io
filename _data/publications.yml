- title: Stability of mitotic spindle using computational mechanics
  authors:
  - Andrii Iakovliev
  - Srinandan Dasmahapatra
  - Atul Bhaskar
  year: 2019
  venue: ICBBB '19 Proceedings of the 2019 9th International Conference on Bioscience, Biochemistry and
    Bioinformatics
  type: conference
  doi: 10.1145/3314367.3314373
  url: https://doi.org/10.1145/3314367.3314373
  pdf_url: null
  abstract: Fidelity of cell division depends on the ability of an internal cell structure called the
    mitotic spindle, to maintain the structural integrity of the cellular architecture despite being subject
    to high compressive loading. We propose a generic software tool called Spindle FEA that employs continuum
    mechanics and finite elements analysis (FEA) code Abaqus CAE to study the stability of mitotic spindles
    in various phases of mitosis. The proposed application has a modular structure which allows easy modification
    of any part of the analysis which is of particular importance considering that new knowledge of spindles
    is constantly emerging. Thanks to the highly optimised finite element solver used in Abaqus CAE, Spindle
    FEA is highly suitable for large multi-parametric studies which in turn may significantly benefit
    the planning of new experiments or identifying new key properties of the spindle. We also discuss
    the main physiological properties of spindles and show how they are modelled with the proposed technique
    as well as discuss all the essential analysis steps. We use Spindle FEA to study the buckling of a
    mitotic spindle in anaphase B to show how the additional stiffness of the lateral support of the spindle
    affects the left-right symmetry of cell division as well as to demonstrate the capacities of the proposed
    technique.
