  type: article
  doi: 10.1038/s41435-025-00352-4
  url: https://doi.org/10.1038/s41435-025-00352-4
  pdf_url: https://www.nature.com/articles/s41435-025-00352-4.pdf
  abstract: The “omnigenic” hypothesis postulates that the polygenic effects of common variants on a typical
    complex trait coalesce on relatively few core genes through trans-effects on their expression. Our
    aim was to identify core genes for systemic lupus erythematosus (SLE) by testing for association with
    genome-wide aggregated trans-effects (GATE) scores for gene expression in a large genetic dataset
    (5267/4909 SLE cases/controls). SLE was strongly associated with upregulation of expression of eight
    interferon-stimulated genes driven by shared trans-effects. We estimate that trans-effects on interferon
    signaling account for 9% of the total genetic effect on SLE risk. Outside this pathway, GATE analysis
    detected twenty putative core genes for SLE. Direct protein measurements for these genes were strongly
    associated with SLE in UK Biobank. Two putative core genes (TNFRSF17, TNFRSF13B) encode receptors
    (BCMA, TACI) expressed on B cells; their ligands (BAFF, APRIL) are targeted by drugs licensed or in
    development for SLE. Four genes (PDCD1, LAG3, TNFRSF9, CD27) encode receptors that have been characterized
    as immune checkpoints, and three (CD5L, SIGLEC1, CXCL13) are biomarkers of SLE disease activity. These
    results provide genetic support for existing drug targets in SLE (interferon signaling, BAFF/APRIL
    signaling) and identify other possible therapeutic targets including immune checkpoint receptors.
